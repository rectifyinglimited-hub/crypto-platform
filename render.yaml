services:
  - type: web
    name: equiti-api
    runtime: node
    plan: free
    buildCommand: npm --prefix backend ci --omit=dev
    startCommand: node backend/server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_TTL
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: sohaib101malik@gmail.com
      - key: ADMIN_USERNAME
        value: sohaib101malik
      - key: ADMIN_PASSWORD
        value: Google1234@
      - key: ADMIN_FULL_NAME
        value: Sohaib Malik
      - key: MONGO_URI
        sync: false
