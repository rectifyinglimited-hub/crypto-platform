<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="theme-color" content="#C8FF00" />
    <meta
      name="description"
      content="equiti — professional digital asset exchange. Delivery trading, AI Bot locks, assets, KYC, and multi-market tools in one secure terminal."
    />
    <title>equiti — Digital Asset Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-nx-bg text-slate-100 antialiased">
    <svg width="0" height="0" class="pointer-events-none absolute h-0 w-0 overflow-hidden" aria-hidden="true">
      <filter id="eq-knock-white" color-interpolation-filters="sRGB">
        <feColorMatrix type="luminanceToAlpha" result="lum" />
        <feComponentTransfer in="lum" result="cut">
          <feFuncA type="table" tableValues="1 1 1 1 1 1 0.35 0" />
        </feComponentTransfer>
        <feComposite in="SourceGraphic" in2="cut" operator="in" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
