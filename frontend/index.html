<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="theme-color" content="#00C2B3" />
    <meta
      name="description"
      content="equiti — professional digital asset exchange. Delivery trading, AI Bot locks, assets, KYC, and multi-market tools in one secure terminal."
    />
    <title>equiti — Digital Asset Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-black text-white antialiased">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Montserrat,sans-serif;background:#000;color:#fff;padding:28px;text-align:center">
        <div style="font-size:28px;font-weight:800;letter-spacing:-0.03em">equiti</div>
        <p id="boot-status" style="margin-top:12px;color:#00C2B3;font-size:14px">Opening exchange…</p>
      </div>
    </div>
    <script>
      window.__equitiReady = function () {
        window.__equitiBooted = true;
      };
      setTimeout(function () {
        if (window.__equitiBooted) return;
        var el = document.getElementById("boot-status");
        if (!el) return;
        el.innerHTML =
          'Still opening. <a href="" style="color:#5EEAD4;text-decoration:underline">Tap to refresh</a>';
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
